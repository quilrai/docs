name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # quilrai/installdocs fires this when the Deployment SOP changes, so /sop/
  # serves its latest main (`npm run build` pulls it, scripts/sync-install-sop.js).
  repository_dispatch:
    types: [install-sop-updated]
  # Daily rebuild as a fallback in case a dispatch is missed.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build website (pulls the Deployment SOP from quilrai/installdocs)
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
